name: Test NSE MCP access

"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-nse-mcp-access
  cancel-in-progress: false

jobs:
  probe-nse-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check documented NSE MCP endpoints without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          """Manual, credential-free probe of NSE's documented MCP services.
          
          Source/usage terms: https://www.nseindia.com/nse-mcp
          This tests connectivity and response shape, not trading-session freshness.
          """
          import datetime as dt
          import html
          import http.cookiejar
          import json
          import math
          import os
          import socket
          import ssl
          import time
          import urllib.error
          import urllib.request
          from zoneinfo import ZoneInfo
          
          IST = ZoneInfo("Asia/Kolkata")
          MAX_BODY = 1_000_000
          PROTOCOLS = {"2025-03-26", "2025-06-18", "2025-11-25"}
          SERVERS = (
              ("nse-bhavcopy", "https://mcp.nseindia.in/bhavcopy/cm/mcp",
               "get_index_snapshot", {"filter": "India VIX"}),
              ("cm-market", "https://mcp.nseindia.in/cmmkt/mcp",
               "cm_get_index_quote", {"indexName": "INDIA VIX"}),
          )
          
          
          class ProbeError(Exception):
              pass
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def checked_reply(value, request_id):
              if (not isinstance(value, dict) or value.get("jsonrpc") != "2.0"
                      or type(value.get("id")) is not int or value["id"] != request_id):
                  raise ProbeError("Unexpected JSON-RPC response")
              if "error" in value or not isinstance(value.get("result"), dict):
                  raise ProbeError("MCP request failed or returned an invalid result")
              return value["result"]
          
          
          def read_reply(response, request_id):
              content_type = response.headers.get_content_type()
              if content_type == "application/json":
                  raw = response.read(MAX_BODY + 1)
                  if len(raw) > MAX_BODY:
                      raise ProbeError("Response exceeds size limit")
                  return checked_reply(json.loads(raw), request_id)
              if content_type != "text/event-stream":
                  raise ProbeError("Unexpected response content type")
              size, fields = 0, []
              deadline = time.monotonic() + 20
              while time.monotonic() < deadline:
                  raw = response.readline(MAX_BODY + 1)
                  size += len(raw)
                  if size > MAX_BODY:
                      raise ProbeError("Response exceeds size limit")
                  if not raw:
                      break
                  line = raw.decode("utf-8").rstrip("\r\n")
                  if not line and fields:
                      event = json.loads("\n".join(fields))
                      fields = []
                      if isinstance(event, dict) and event.get("id") == request_id:
                          return checked_reply(event, request_id)
                  elif line.startswith("data:"):
                      fields.append(line[5:].removeprefix(" "))
              raise ProbeError("Stream ended or timed out without the requested response")
          
          
          class Client:
              def __init__(self, url):
                  self.url, self.session, self.version, self.request_id = url, None, None, 0
                  self.stage = "not started"
                  # Retain only the MCP server's session/affinity cookies. No website warm-up.
                  self.opener = urllib.request.build_opener(
                      urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()), NoRedirect())
          
              def send(self, method, params=None, notification=False):
                  self.stage = method
                  message = {"jsonrpc": "2.0", "method": method}
                  if params is not None:
                      message["params"] = params
                  if not notification:
                      self.request_id += 1
                      message["id"] = self.request_id
                  headers = {"Content-Type": "application/json",
                             "Accept": "application/json, text/event-stream",
                             "User-Agent": "nse-personal-report-connectivity-test/0.1"}
                  if self.session:
                      headers["Mcp-Session-Id"] = self.session
                  if self.version:
                      headers["MCP-Protocol-Version"] = self.version
                  request = urllib.request.Request(self.url, data=json.dumps(message).encode(),
                                                   headers=headers, method="POST")
                  with self.opener.open(request, timeout=15) as response:
                      if method == "initialize":
                          self.session = response.headers.get("Mcp-Session-Id")
                      if notification:
                          if response.status != 202:
                              raise ProbeError("Initialization notification was not accepted")
                          return None
                      return read_reply(response, self.request_id)
          
              def initialize(self):
                  result = self.send("initialize", {
                      "protocolVersion": "2025-03-26", "capabilities": {},
                      "clientInfo": {"name": "nse-personal-report-connectivity-test", "version": "0.1"},
                  })
                  self.version = result.get("protocolVersion")
                  if self.version not in PROTOCOLS:
                      raise ProbeError("Unsupported MCP protocol version")
                  self.send("notifications/initialized", notification=True)
          
              def close(self):
                  if not self.session:
                      return
                  request = urllib.request.Request(self.url, method="DELETE", headers={
                      "Mcp-Session-Id": self.session, "MCP-Protocol-Version": self.version or "2025-03-26",
                  })
                  try:
                      with self.opener.open(request, timeout=5):
                          pass
                  except Exception:
                      pass  # Cleanup is best-effort and cannot turn a failed probe into success.
          
          
          def tool_payload(result):
              if result.get("isError"):
                  raise ProbeError("Market-data tool returned an error")
              data = result.get("structuredContent")
              if not isinstance(data, dict):
                  blocks = result.get("content", [])
                  texts = [b["text"] for b in blocks if isinstance(b, dict)
                           and b.get("type") == "text" and isinstance(b.get("text"), str)]
                  if len(texts) != 1:
                      raise ProbeError("Market-data payload is missing or ambiguous")
                  data = json.loads(texts[0])
              if not isinstance(data, dict) or data.get("error") or data.get("warning") or data.get("warnings"):
                  raise ProbeError("Market-data payload contains an error/warning or has an invalid shape")
              return data
          
          
          def validate(name, data, requested_date):
              if name == "nse-bhavcopy":
                  date_text = data.get("date")
                  rows = data.get("indices")
                  if not isinstance(rows, list):
                      raise ProbeError("Bhavcopy index rows are missing")
                  rows = [r for r in rows if isinstance(r, dict)
                          and str(r.get("indexName", "")).casefold() == "india vix"]
                  if len(rows) != 1 or rows[0].get("date") != date_text:
                      raise ProbeError("Bhavcopy index or session date is ambiguous")
                  market_date = dt.date.fromisoformat(date_text)
                  value = rows[0].get("close")
                  stamp = market_date.isoformat() + " (EOD)"
              else:
                  stamp = data.get("nseTimestamp")
                  timestamp = dt.datetime.strptime(stamp, "%d-%b-%Y %H:%M:%S").replace(tzinfo=IST)
                  market_date = timestamp.date()
                  if timestamp > dt.datetime.now(IST) + dt.timedelta(minutes=5):
                      raise ProbeError("NSE timestamp is in the future")
                  row = data.get("index")
                  if not isinstance(row, dict) or row.get("indexName", "").casefold() != "india vix":
                      raise ProbeError("Unexpected live index")
                  value = row.get("last")
              if market_date > requested_date:
                  raise ProbeError("Market-data date is after the requested date")
              if type(value) not in (int, float) or not math.isfinite(value) or value <= 0:
                  raise ProbeError("India VIX value is missing or invalid")
              return {"status": "PASS", "value": value, "data_as_of": stamp,
                      "calendar_age_days": (requested_date - market_date).days,
                      "freshness": "NOT VERIFIED against the NSE trading calendar"}
          
          
          def probe(name, url, tool, arguments, date):
              params = dict(arguments)
              if name == "nse-bhavcopy":
                  params["date"] = date.isoformat()
              failures = []
              for attempt in range(2):
                  client = Client(url)
                  try:
                      client.initialize()
                      data = tool_payload(client.send("tools/call", {"name": tool, "arguments": params}))
                      result = validate(name, data, date)
                      result["attempts"] = attempt + 1
                      if failures:
                          result["earlier_attempt_failures"] = failures
                      return result
                  except Exception as exc:
                      if isinstance(exc, urllib.error.HTTPError):
                          reason = f"HTTP {exc.code}"
                      elif isinstance(exc, urllib.error.URLError):
                          reason = "TLS verification failed" if isinstance(exc.reason, ssl.SSLCertVerificationError) else "Network request failed"
                      elif isinstance(exc, (socket.timeout, TimeoutError)):
                          reason = "Network timeout"
                      elif isinstance(exc, ProbeError):
                          reason = str(exc)
                      else:
                          reason = "Malformed response or unexpected schema"
                      stage = client.stage
                      failures.append({"attempt": attempt + 1, "stage": stage, "reason": reason})
                  finally:
                      client.close()
                  if not attempt:
                      time.sleep(2)  # One bounded retry; each attempt starts a fresh MCP session.
              return {"status": "FAIL", "reason": reason, "failed_stage": stage,
                      "attempts": 2, "attempt_failures": failures}
          
          
          def main():
              checked_at = dt.datetime.now(IST)
              results = {}
              for name, url, tool, arguments in SERVERS:
                  results[name] = probe(name, url, tool, arguments, checked_at.date())
                  print(name + ": " + json.dumps(results[name], ensure_ascii=True))
              passed = all(r["status"] == "PASS" for r in results.values())
              lines = ["## NSE MCP connectivity test", "", "Checked at: " + checked_at.isoformat(), "",
                       "| Service | Connectivity/schema | India VIX | Data as of | Calendar age (days) |",
                       "| --- | --- | --- | --- | --- |"]
              diagnostics = []
              for name, result in results.items():
                  fields = [name, result["status"], result.get("value", "N/A"),
                            result.get("data_as_of", "N/A"), result.get("calendar_age_days", "N/A")]
                  lines.append("| " + " | ".join(html.escape(str(f)).replace("|", "&#124;") for f in fields) + " |")
                  if result["status"] == "FAIL":
                      diagnostics.append("- " + name + ": " + result["reason"]
                                         + "; stage: " + result["failed_stage"])
              if diagnostics:
                  lines.extend(["", *diagnostics])
              if passed and results["nse-bhavcopy"]["value"] != results["cm-market"]["value"]:
                  lines.extend(["", "**WARNING:** The two India VIX values differ. Reconcile session dates and final close versus last-published snapshot before use."])
              lines.extend(["", "This is a manual connectivity/schema test. It does not verify the trading calendar, 07:45 IST availability, report calculations or delivery.",
                            "", "Market values can belong to an earlier session. Freshness is NOT VERIFIED; no final market bias is assigned.",
                            "", "Source and usage terms: https://www.nseindia.com/nse-mcp (personal informational, noncommercial use).", ""])
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write("\n".join(lines))
              raise SystemExit(0 if passed else 1)
          
          
          if __name__ == "__main__":
              main()
          PY
