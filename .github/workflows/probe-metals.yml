name: Probe gold and silver response schema
on:
  push:
    branches: [fix/spot-metals]
    paths: ['.github/workflows/probe-metals.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Inspect response shape only
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python3 -m integrated.probe_metals
