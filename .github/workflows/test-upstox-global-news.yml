name: Test Upstox global quotes and news

"on":
  push:
    branches: ["codex/global-news-access"]
    paths: [".github/workflows/test-upstox-global-news.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-upstox-global-news
  cancel-in-progress: false

jobs:
  probe-global-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Validate global quote metadata and cutoff-based news
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          """Manual GET-only Upstox global-quotes/news probe. Never prints credentials or raw responses.
          
          Documentation read: https://upstox.com/developer/api-documentation/
          announcements/global-instruments/, get-full-market-quote/, get-news/
          This is an access/schema test, not the report's expiry policy or scoring model.
          """
          import datetime as dt
          import gzip
          import io
          import unicodedata
          import html
          import json
          import math
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo
          
          IST = ZoneInfo("Asia/Kolkata")
          INDICES = {"Nifty": "NSE_INDEX|Nifty 50", "Bank Nifty": "NSE_INDEX|Nifty Bank",
                     "India VIX": "NSE_INDEX|India VIX"}
          PATHS = {"/market-quote/quotes", "/news"}
          CLIENT_IDENTITY = "NSEMorningReport/0.1 (personal read-only market-data report)"
          
          
          class CheckFailure(Exception):
              """Only fixed, credential-free messages may be raised here."""
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def number(value, positive=False):
              return (type(value) in (int, float) and math.isfinite(value)
                      and (value > 0 if positive else value >= 0))
          
          
          def http_error_diagnostic(error):
              """Expose only categorical markers and tightly validated Upstox codes.
          
              Never return response messages, URLs, headers, identifiers or raw body text.
              """
              try:
                  raw = error.read(16_385)
                  truncated = len(raw) > 16_384
                  raw = raw[:16_384]
                  text = raw.decode("utf-8", errors="replace")
                  lower = text.lower()
                  codes = set()
                  kind = "HTML" if re.search(r"<(?:!doctype\s+html|html|head|body)\b", lower) else "OTHER"
                  try:
                      data = json.loads(text)
                      kind = "JSON"
                      if isinstance(data, dict):
                          entries = [data]
                          if isinstance(data.get("errors"), list):
                              entries.extend(data["errors"][:20])
                          for entry in entries:
                              if not isinstance(entry, dict):
                                  continue
                              for field in ("errorCode", "error_code"):
                                  code = entry.get(field)
                                  if isinstance(code, str) and re.fullmatch(r"UDAPI[0-9]{1,8}", code):
                                      codes.add(code)
                  except (ValueError, TypeError):
                      pass
                  cloudflare = "cloudflare" in lower
                  return ("body=" + kind + "; provider_codes=" + (",".join(sorted(codes)[:5]) or "none")
                          + "; cloudflare_marker=" + ("yes" if cloudflare else "no")
                          + "; error_1010_marker=" + ("yes" if cloudflare and re.search(r"\b1010\b", lower) else "no")
                          + "; truncated=" + ("yes" if truncated else "no"))
              except Exception:
                  return "body=UNREADABLE; provider_codes=none"
          
          
          class API:
              def __init__(self, token):
                  if not isinstance(token, str) or not 20 <= len(token) <= 8192 or not re.fullmatch(r"[!-~]+", token):
                      raise CheckFailure("UPSTOX_ANALYTICS_TOKEN is missing or malformed; save only the token value.")
                  self.token = token
                  self.auth_failed = False
                  self.deadline = time.monotonic() + 300
                  self.opener = urllib.request.build_opener(NoRedirect())
          
              def get(self, path, params, envelope=False):
                  if path not in PATHS:
                      raise CheckFailure("Request path is outside the read-only test allowlist.")
                  request = urllib.request.Request(
                      "https://api.upstox.com/v2" + path + "?" + urllib.parse.urlencode(params),
                      headers={"Accept": "application/json", "Authorization": "Bearer " + self.token,
                               "User-Agent": CLIENT_IDENTITY},
                      method="GET",
                  )
                  for attempt in range(2):
                      try:
                          remaining = self.deadline - time.monotonic()
                          if remaining <= 0:
                              raise CheckFailure("Probe time budget exhausted.")
                          with self.opener.open(request, timeout=min(15, remaining)) as response:
                              raw = response.read(4_000_001)
                          if len(raw) > 4_000_000:
                              raise CheckFailure("Response exceeded the size limit.")
                          payload = json.loads(raw)
                          if not isinstance(payload, dict) or payload.get("status") != "success" or "data" not in payload:
                              raise CheckFailure("API returned an error or unexpected response envelope.")
                          return payload if envelope else payload["data"]
                      except urllib.error.HTTPError as exc:
                          code = exc.code
                          try:
                              diagnostic = http_error_diagnostic(exc)
                          finally:
                              exc.close()
                          if code in (401, 403):
                              self.auth_failed = True
                              raise CheckFailure("HTTP " + str(code) + ": request rejected; " + diagnostic) from None
                          if not attempt and (code == 429 or 500 <= code <= 599):
                              time.sleep(2)
                              continue
                          raise CheckFailure("HTTP " + str(code) + ": request failed; " + diagnostic) from None
                      except (urllib.error.URLError, TimeoutError):
                          if not attempt:
                              time.sleep(2)
                              continue
                          raise CheckFailure("Network/TLS request failed; verification was not bypassed.") from None
                      except (ValueError, UnicodeError):
                          raise CheckFailure("Response was not valid JSON; details suppressed.") from None
          
          
          def timestamp(value, now):
              if value is None or value == "":
                  return None
              try:
                  if isinstance(value, str) and re.fullmatch(r"[0-9]{13}", value):
                      result = dt.datetime.fromtimestamp(int(value) / 1000, dt.timezone.utc)
                  elif type(value) is int and 1_000_000_000_000 <= value < 10_000_000_000_000:
                      result = dt.datetime.fromtimestamp(value / 1000, dt.timezone.utc)
                  elif isinstance(value, str):
                      result = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
                      if result.tzinfo is None:
                          return None  # Do not invent a timezone.
                  else:
                      return None
                  if result > now + dt.timedelta(minutes=5):
                      raise CheckFailure("Provider timestamp is in the future.")
                  return result.astimezone(IST).isoformat(timespec="seconds")
              except (ValueError, OverflowError, OSError):
                  return None
          
          
          GLOBAL_FILE = "https://assets.upstox.com/market-quote/instruments/exchange/global.json.gz"
          TARGETS = ("GIFT NIFTY", "DOW JONES", "S&P", "US Tech 100", "HANG SENG", "NIKKEI 225",
                     "USD INR", "Oil (Brent)", "Oil (WTI)")
          # Sample stock keys from the News API's official request example. No holdings access.
          NEWS_KEYS = ("NSE_EQ|INE040H01021", "NSE_EQ|INE002A01018")
          
          
          def global_file():
              """Fixed public asset host; never attach the private API credential."""
              opener = urllib.request.build_opener(NoRedirect())
              request = urllib.request.Request(GLOBAL_FILE, headers={"User-Agent": CLIENT_IDENTITY}, method="GET")
              for attempt in range(2):
                  try:
                      with opener.open(request, timeout=15) as response:
                          raw = response.read(1_000_001)
                      if len(raw) > 1_000_000:
                          raise CheckFailure("Global instrument file exceeded its compressed size limit.")
                      with gzip.GzipFile(fileobj=io.BytesIO(raw)) as stream:
                          decoded = stream.read(4_000_001)
                      if len(decoded) > 4_000_000:
                          raise CheckFailure("Global instrument file exceeded its decoded size limit.")
                      return json.loads(decoded)
                  except urllib.error.HTTPError as exc:
                      code = exc.code
                      exc.close()
                      if not attempt and (code == 429 or 500 <= code <= 599):
                          time.sleep(2)
                          continue
                      raise CheckFailure("Public instrument download failed: HTTP " + str(code) + ".") from None
                  except (urllib.error.URLError, TimeoutError):
                      if not attempt:
                          time.sleep(2)
                          continue
                      raise CheckFailure("Public instrument download failed; TLS verification was not bypassed.") from None
                  except (ValueError, OSError, EOFError):
                      raise CheckFailure("Public instrument gzip/JSON was invalid.") from None
          
          
          def instruments(data):
              if not isinstance(data, list) or not data:
                  raise CheckFailure("Global instrument file is empty or not an array.")
              selected, seen = {}, set()
              for row in data:
                  if not isinstance(row, dict):
                      raise CheckFailure("Invalid global-instrument row.")
                  key = row.get("instrument_key")
                  if not isinstance(key, str) or key in seen:
                      raise CheckFailure("Missing or duplicate global instrument key.")
                  seen.add(key)
                  name = row.get("name")
                  if name not in TARGETS:
                      continue
                  segment = row.get("segment")
                  latency = row.get("latency")
                  expected_segment = "GLOBAL_INDICATOR" if name in ("USD INR", "Oil (Brent)", "Oil (WTI)") else "GLOBAL_INDEX"
                  if (name in selected or row.get("exchange") != "GLOBAL"
                          or segment != expected_segment
                          or not re.fullmatch(r"GLOBAL_(?:INDEX|INDICATOR)\|[A-Za-z0-9^ ._-]{1,80}", key)
                          or key.split("|", 1)[0] != segment
                          or not isinstance(latency, str) or not re.fullmatch(r"(?:20|120|900) Seconds", latency)):
                      raise CheckFailure("Ambiguous global identity, segment or refresh metadata.")
                  selected[name] = {"name": name, "instrument_key": key, "segment": segment,
                                    "documented_refresh_seconds": int(latency.split()[0])}
              if set(selected) != set(TARGETS):
                  raise CheckFailure("At least one required global instrument is absent from the provider file.")
              return selected
          
          
          def global_quote(data, instrument, now):
              if not isinstance(data, dict):
                  raise CheckFailure("Global quotes are not an object.")
              matches = [row for row in data.values() if isinstance(row, dict)
                         and row.get("instrument_token") == instrument["instrument_key"]]
              if len(matches) != 1 or not number(matches[0].get("last_price"), positive=True):
                  raise CheckFailure("Global quote identity, uniqueness or positive price check failed.")
              row = matches[0]
              update, trade = timestamp(row.get("timestamp"), now), timestamp(row.get("last_trade_time"), now)
              close = row.get("ohlc", {}).get("close") if isinstance(row.get("ohlc"), dict) else None
              change = row.get("net_change")
              finite_change = type(change) in (int, float) and math.isfinite(change)
              def age(stamp):
                  return round((now - dt.datetime.fromisoformat(stamp)).total_seconds(), 1) if stamp else None
              return {"status": "PASS" if update and trade else "PARTIAL", **instrument,
                      "last_price": row["last_price"], "ohlc_close_raw": close if number(close, True) else None,
                      "provider_net_change_raw": change if finite_change else None,
                      "quote_update_IST": update or "N/A", "last_trade_IST": trade or "N/A",
                      "quote_update_age_seconds": age(update), "last_trade_age_seconds": age(trade),
                      "freshness": "UNVERIFIED: independent market calendar and timestamp semantics not reconciled.",
                      "identity_note": "Provider display name retained; contract, benchmark construction and units not independently reconciled."}
          
          
          def news_cutoff(now):
              cutoff = now.astimezone(IST).replace(hour=7, minute=45, second=0, microsecond=0)
              if cutoff > now:
                  cutoff -= dt.timedelta(days=1)
              return cutoff
          
          
          def news_link(value):
              if not isinstance(value, str) or len(value) > 2048 or any(ord(char) < 33 for char in value):
                  raise CheckFailure("News link is absent or malformed.")
              try:
                  url = urllib.parse.urlsplit(value)
                  if (url.scheme != "https" or url.hostname not in ("upstox.com", "www.upstox.com")
                          or url.username or url.password or url.port not in (None, 443)
                          or not url.path.startswith("/news/")):
                      raise CheckFailure("News link is outside the documented publisher URL pattern.")
                  return urllib.parse.urlunsplit(("https", "upstox.com", url.path.rstrip("/") + "/", "", ""))
              except ValueError:
                  raise CheckFailure("News link is malformed.") from None
          
          
          def news_page(payload, page, now):
              if not isinstance(payload, dict) or not isinstance(payload.get("data"), dict):
                  raise CheckFailure("News response does not contain an instrument map.")
              metadata = payload.get("metadata", {}).get("page") if isinstance(payload.get("metadata"), dict) else None
              if not isinstance(metadata, dict):
                  raise CheckFailure("News pagination metadata is absent.")
              for name in ("page_number", "page_size", "total_pages", "total_records"):
                  if type(metadata.get(name)) is not int or metadata[name] < 0:
                      raise CheckFailure("News pagination counters are invalid.")
              if metadata["page_number"] != page or not 1 <= metadata["page_size"] <= 100 or metadata["total_pages"] > 100:
                  raise CheckFailure("News pagination range or page identity is invalid.")
              if metadata["total_records"] > 0 and metadata["total_pages"] < page:
                  raise CheckFailure("News pagination coverage is inconsistent.")
              articles = []
              for key, rows in payload["data"].items():
                  if key not in NEWS_KEYS or not isinstance(rows, list):
                      raise CheckFailure("News contains an unrequested instrument or invalid article array.")
                  for row in rows:
                      if not isinstance(row, dict):
                          raise CheckFailure("News article is not an object.")
                      heading = row.get("heading")
                      stamp = row.get("published_time")
                      if (not isinstance(heading, str) or not heading.strip() or len(heading) > 2000
                              or type(stamp) is not int or not 1_000_000_000_000 <= stamp < 10_000_000_000_000):
                          raise CheckFailure("News headline or publication milliseconds are invalid.")
                      published = timestamp(stamp, now)
                      if published is None:
                          raise CheckFailure("News publication timestamp cannot be interpreted.")
                      articles.append({"title": " ".join(html.unescape(heading).split()),
                                       "url": news_link(row.get("article_link")), "published_IST": published})
              return articles, metadata["total_pages"]
          
          
          def window_news(articles, cutoff):
              lower = cutoff - dt.timedelta(hours=12)
              candidates = [row for row in articles if lower < dt.datetime.fromisoformat(row["published_IST"]) <= cutoff]
              seen_titles, seen_urls, kept = set(), set(), []
              for row in sorted(candidates, key=lambda item: dt.datetime.fromisoformat(item["published_IST"]), reverse=True):
                  normalized = " ".join(re.findall(r"\w+", unicodedata.normalize("NFKC", row["title"]).casefold()))
                  if not normalized:
                      raise CheckFailure("News title has no usable text.")
                  if normalized in seen_titles or row["url"] in seen_urls:
                      continue
                  seen_titles.add(normalized)
                  seen_urls.add(row["url"])
                  kept.append(row)
              return kept, len(candidates) - len(kept)
          
          
          def news_check(api, now):
              articles, total_pages, pages_read = [], 1, 0
              for page in range(1, 6):
                  payload = api.get("/news", {"category": "instrument_keys", "instrument_keys": ",".join(NEWS_KEYS),
                                              "page_number": page, "page_size": 100}, envelope=True)
                  rows, total_pages = news_page(payload, page, now)
                  articles.extend(rows)
                  pages_read = page
                  if page >= total_pages:
                      break
              cutoff = news_cutoff(now)
              kept, duplicates = window_news(articles, cutoff)
              truncated = total_pages > pages_read
              return {"status": "PARTIAL" if truncated or not kept else "PASS", "access_schema": "PASS",
                      "cutoff_IST": cutoff.isoformat(), "window_start_exclusive_IST": (cutoff - dt.timedelta(hours=12)).isoformat(),
                      "scope": "Two documented sample equity keys only; broad market/macro coverage is PARTIAL.",
                      "pages_read": pages_read, "total_pages": total_pages, "pagination_truncated": truncated,
                      "validated_article_rows": len(articles), "unique_window_articles": len(kept), "duplicates_removed": duplicates,
                      "deduplication": "Canonical publisher link or normalized matching headline; paraphrased syndication remains unverified.",
                      "articles": kept[:10], "summary_article_limit": 10,
                      "empty_window_note": None if kept else "No matching articles returned for this cutoff; never interpreted as no market news."}
          
          
          def attempt(results, label, run):
              try:
                  results.append({"check": label, **run()})
              except CheckFailure as exc:
                  results.append({"check": label, "status": "FAIL", "reason": str(exc)})
              except Exception:
                  results.append({"check": label, "status": "FAIL", "reason": "Unexpected response/schema; sensitive details suppressed."})
          
          
          def run_checks(api, now):
              results = []
              try:
                  selected = instruments(global_file())
                  results.append({"check": "Global instrument file", "status": "PASS", "selected_instruments": len(selected),
                                  "source": GLOBAL_FILE, "permission_basis": "Provider-published instrument download and documented market-quote integration."})
                  quotes = api.get("/market-quote/quotes", {"instrument_key": ",".join(selected[name]["instrument_key"] for name in TARGETS)})
                  for name in TARGETS:
                      attempt(results, name, lambda: global_quote(quotes, selected[name], now))
              except CheckFailure as exc:
                  results.append({"check": "Global data", "status": "FAIL", "reason": str(exc)})
              if api.auth_failed:
                  results.append({"check": "News API", "status": "SKIPPED", "reason": "Earlier request was rejected."})
              else:
                  attempt(results, "News API", lambda: news_check(api, now))
              results.append({"check": "Economic calendar", "status": "UNVERIFIED",
                              "reason": "No suitable documented free macro-calendar source is connected; not replaced by corporate news."})
              return results
          
          
          def summary(results, now):
              lines = ["## Upstox global quotes and news test", "", "Checked at: " + now.isoformat(), "",
                       "| Check | Access/schema | Quote update IST | Last trade IST |", "| --- | --- | --- | --- |"]
              for row in results:
                  fields = (row["check"], row["status"], row.get("quote_update_IST", "N/A"), row.get("last_trade_IST", "N/A"))
                  lines.append("| " + " | ".join(html.escape(str(item)).replace("|", "&#124;") for item in fields) + " |")
              lines.extend(["", "Validated observations and fixed diagnostics; credentials and raw API responses are hidden:", ""])
              lines.extend("- " + html.escape(json.dumps(row, ensure_ascii=True)) for row in results)
              lines.extend(["", "PASS is an access/schema result, not production readiness or independently VERIFIED market freshness.",
                            "Quote-update time and last-trade time are shown separately. Refresh intervals are provider metadata, not freshness guarantees. Global benchmark identity/units and market calendars need independent reconciliation.",
                            "News uses the latest elapsed 07:45 IST cutoff and the preceding 12 hours. An evening test therefore uses that morning's cutoff. The report schedule and 08:00 IST delivery are not enabled by this test.",
                            "Only two sample equities are queried for news. Broad market/macro news, paraphrased syndicated duplicates and an economic calendar remain incomplete. No market bias, score, causal narrative or Telegram message is produced.",
                            "Sources: https://upstox.com/developer/api-documentation/announcements/global-instruments/ and https://upstox.com/developer/api-documentation/get-news/", ""])
              return "\n".join(lines)
          
          
          def main():
              now = dt.datetime.now(IST)
              try:
                  results = run_checks(API(os.environ.get("UPSTOX_ANALYTICS_TOKEN", "")), now)
              except CheckFailure as exc:
                  results = [{"check": "Configuration", "status": "FAIL", "reason": str(exc)}]
              except Exception:
                  results = [{"check": "Probe", "status": "FAIL", "reason": "Unexpected response/schema; sensitive details suppressed."}]
              for row in results:
                  print(json.dumps(row, ensure_ascii=True))
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                      stream.write(summary(results, now))
              # Economic-calendar UNVERIFIED is explicitly outside this access test. A
              # successful job must still not be interpreted as a complete report pipeline.
              checks = [row for row in results if row["check"] != "Economic calendar"]
              return 0 if len(checks) == 11 and all(row["status"] == "PASS" for row in checks) else 1
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          
          PY
