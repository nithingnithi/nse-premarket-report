name: Deliver reviewed morning PDF
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'YYYY-MM-DD; blank means today IST'
        type: string
        required: false
      dry_run:
        description: 'Validate PDF only; do not send Telegram'
        type: boolean
        default: true
      pdf_followup:
        description: 'One-time PDF after a confirmed text delivery on this date'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: morning-channel-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - run: python3 -m pip install -r requirements-report.txt
      - name: Validate review and deliver PDF once
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          NSE_BREADTH_FOR_DELIVERY: ${{ vars.NSE_BREADTH_FOR_DELIVERY }}
          REPORT_DATE: ${{ inputs.report_date }}
          PDF_FOLLOWUP: ${{ inputs.pdf_followup && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -m integrated.deliver
